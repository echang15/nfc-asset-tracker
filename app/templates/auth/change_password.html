{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth-wrap" style="margin-top:2rem">
  <h1>Change password</h1>
  <div class="card">
    <form method="post" class="stacked">
      {{ m.csrf() }}
      {% if current_user.password_hash %}<label>Current password</label><input type="password" name="current" required>{% endif %}
      <label>New password</label><input type="password" name="new" required minlength="8">
      <label>Confirm new password</label><input type="password" name="confirm" required minlength="8">
      <p><button class="btn primary" type="submit">Update password</button></p>
    </form>
  </div>
</div>
{% endblock %}
